# On PRs: boots the backend against a throwaway DB, regenerates backend/docs/openapi.json,
# and commits it to the PR branch if it changed (main is protected, so never push there)
name: API docs
on:
  pull_request:
    paths: ['backend/**']
permissions:
  contents: write
jobs:
  docs:
    if: github.event.pull_request.head.repo.full_name == github.repository # forks can't be pushed to
    runs-on: ubuntu-latest
    env:
      AUX_JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUX_R2_ACCOUNT_ID: ci
      AUX_R2_ACCESS_KEY_ID: ci
      AUX_R2_SECRET_ACCESS_KEY: ci
      AUX_R2_BUCKET: ci
      AUX_PRIVATE_TRACKS_R2_ACCESS_KEY_ID: ci
      AUX_PRIVATE_TRACKS_R2_SECRET_ACCESS_KEY: ci
      AUX_PRIVATE_TRACKS_R2_BUCKET: ci
      AUX_R2_PUBLIC_BASE_URL: https://ci.invalid
      SPRING_DATASOURCE_URL: jdbc:sqlite:/tmp/ci.db
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.head_ref }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25, cache: maven }
      - run: ./mvnw -B -q verify
        working-directory: backend
      - name: Commit updated spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/docs
          git diff --cached --quiet || { git commit -m "Update OpenAPI spec" && git push; }
