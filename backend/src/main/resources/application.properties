server.port=5000

# Flyway owns the schema: it applies db/migration/V<n>__*.sql on startup, then Hibernate only validates.
# Schema change = new V<n+1>__*.sql file; never edit an applied one. A DB that predates Flyway is baselined at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# IMMEDIATE takes the write lock at BEGIN, so concurrent writers wait (up to busy_timeout ms)
# instead of failing with SQLITE_BUSY when a read lock can't be upgraded mid-transaction
spring.datasource.url=jdbc:sqlite:../backend/aux.db?foreign_keys=on&transaction_mode=IMMEDIATE&busy_timeout=5000
# WAL: reads outside a transaction no longer wait for a writer, and commits are cheaper. Set on every new connection,
# so it applies even when SPRING_DATASOURCE_URL overrides the URL above. It's stored in the DB file, which then has
# aux.db-wal and aux.db-shm next to it: back up with sqlite3 .backup, not by copying aux.db alone
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

aux.uploads-dir=../uploads

# Global caps, checked before controllers run. Per-file: one mp3 (~25MB); per-request: a batch of mp3s.
# PFP (5MB) and username limits are enforced tighter in the services.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=150MB
# Non-file fields (username, JSON uuids) and form bodies; Tomcat default is 2MB
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=8KB

# Loads backend/.env (KEY=value lines) as properties; real env vars still win
spring.config.import=optional:file:.env[.properties]
aux.jwt-secret=${AUX_JWT_SECRET}
# Cloudflare R2 (S3 API). Use one token per bucket, each scoped to Object Read & Write on that bucket only.
# public-base-url is the bucket's custom domain, e.g. https://media.example.com
aux.r2.account-id=${AUX_R2_ACCOUNT_ID}
aux.r2.access-key-id=${AUX_R2_ACCESS_KEY_ID}
aux.r2.secret-access-key=${AUX_R2_SECRET_ACCESS_KEY}
aux.r2.bucket=${AUX_R2_BUCKET}
# Private bucket for MP3s: no public domain, only reachable through signed URLs
aux.r2.audio-bucket=${AUX_PRIVATE_TRACKS_R2_BUCKET}
aux.r2.audio-access-key-id=${AUX_PRIVATE_TRACKS_R2_ACCESS_KEY_ID}
aux.r2.audio-secret-access-key=${AUX_PRIVATE_TRACKS_R2_SECRET_ACCESS_KEY}
aux.r2.public-base-url=${AUX_R2_PUBLIC_BASE_URL}
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
# Resend email. "from" must be on a domain verified in Resend (aux.justinabruinsma.com is); set AUX_EMAIL_FROM to override
aux.resend.api-key=${RESEND_API_KEY}
aux.resend.from=${AUX_EMAIL_FROM:Aux <noreply@aux.justinabruinsma.com>}

# YouTube import (POST /api/imports/youtube): testers and admins only, and off unless AUX_YOUTUBE_IMPORT_ENABLED=true.
# Needs yt-dlp, ffmpeg and deno (yt-dlp's JS runtime for YouTube) on the server's PATH. Keep yt-dlp up to date:
# YouTube changes often and an old yt-dlp is the usual reason imports start failing.
aux.youtube-import.enabled=${AUX_YOUTUBE_IMPORT_ENABLED:false}
aux.youtube-import.yt-dlp-path=${AUX_YT_DLP_PATH:yt-dlp}
# Blank = find ffmpeg on PATH
aux.youtube-import.ffmpeg-location=${AUX_FFMPEG_LOCATION:}
# Optional Netscape cookies file, for when YouTube asks the server to "confirm you're not a bot" (use a throwaway account)
aux.youtube-import.cookies-file=${AUX_YT_COOKIES_FILE:}
aux.youtube-import.work-dir=${AUX_YOUTUBE_IMPORT_WORK_DIR:${java.io.tmpdir}/aux-youtube-imports}
# Imports running at once; each one keeps a CPU busy while ffmpeg converts
aux.youtube-import.concurrency=${AUX_YOUTUBE_IMPORT_CONCURRENCY:1}
