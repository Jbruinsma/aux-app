server.port=5000

# Shared with the Python backend. Alembic owns the schema; Hibernate only checks it.
# IMMEDIATE takes the write lock at BEGIN, so concurrent writers wait (up to busy_timeout ms)
# instead of failing with SQLITE_BUSY when a read lock can't be upgraded mid-transaction
spring.datasource.url=jdbc:sqlite:../backend/aux.db?foreign_keys=on&transaction_mode=IMMEDIATE&busy_timeout=5000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

aux.uploads-dir=../uploads

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Loads backend-java/.env (KEY=value lines) as properties; real env vars still win
spring.config.import=optional:file:.env[.properties]
aux.jwt-secret=${AUX_JWT_SECRET}
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
