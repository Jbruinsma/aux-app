server.port=5000

# Hibernate only validates the schema (ddl-auto=validate); it never creates or migrates tables.
# IMMEDIATE takes the write lock at BEGIN, so concurrent writers wait (up to busy_timeout ms)
# instead of failing with SQLITE_BUSY when a read lock can't be upgraded mid-transaction
spring.datasource.url=jdbc:sqlite:../backend/aux.db?foreign_keys=on&transaction_mode=IMMEDIATE&busy_timeout=5000
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

aux.uploads-dir=../uploads

# Global caps, checked before controllers run. Per-file: one mp3 (~25MB); per-request: a batch of mp3s.
# PFP (5MB) and username limits are enforced tighter in the services.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=150MB
# Non-file fields (username, JSON uuids) and form bodies; Tomcat default is 2MB
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=8KB

# Loads backend/.env (KEY=value lines) as properties; real env vars still win
spring.config.import=optional:file:.env[.properties]
aux.jwt-secret=${AUX_JWT_SECRET}
# Cloudflare R2 (S3 API). Use a token scoped to Object Read & Write on this bucket only.
# public-base-url is the bucket's custom domain, e.g. https://media.example.com
aux.r2.account-id=${AUX_R2_ACCOUNT_ID}
aux.r2.access-key-id=${AUX_R2_ACCESS_KEY_ID}
aux.r2.secret-access-key=${AUX_R2_SECRET_ACCESS_KEY}
aux.r2.bucket=${AUX_R2_BUCKET}
aux.r2.public-base-url=${AUX_R2_PUBLIC_BASE_URL}
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
